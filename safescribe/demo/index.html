    ...[said, direct, changed].map((f) => ['API_KEY', f(KEYW)]),
    ...[said, direct, changed].map((f) => ['PASSWORD', f(PASS)]),
    ['API_KEY', /\b(?:sk|pk|rk)[-_][\w-]{8,}|\bgh[pousr]_\w{16,}|\bgithub_pat_\w{16,}|\b(?:AKIA|ASIA)[A-Z0-9]{12,}|\bAIza[\w-]{20,}|\bxox[abprs]-[\w-]{8,}|\beyJ[\w-]{6,}\.[\w-]{6,}(?:\.[\w-]*)?|(?=[\w-]*\d)(?=[\w-]*[A-Za-z])[\w-]{20,}/gd],
    ['EMAIL', /[\w.+-]+\s?@\s?[\w-]+(?:\.[\w-]+)*/gd],
    ['EMAIL', /\b[\w+]+(?:(?:\s+(?:dot|underscore|dash|plus)\s+|[._-])[\w+]+)*\s+at\s+(?:[\w-]+(?:\s+dot\s+|\.)){1,3}(?:com|org|net|io|co|edu|gov|dev|ai)\b/gid],
    ['ADDRESS', new RegExp(`\\b\\d[\\d,]{0,6}[A-Za-z]?\\s+(?:(?:north|south|east|west|[nsew]\\.?)\\s+)?(?:[\\w'.]+\\s+){1,3}?${STREET}\\b\\.?(?:,?\\s+(?:apartment|apt|suite|unit|#)\\.?\\s*\\w+)?`, 'gid')],
    ['ADDRESS', /\bp\.?\s?o\.?\s+box\s+\d+/gid],
    ['ADDRESS', /\b(?:home address|my address|address is|lives? at)\s+(?:is\s+|at\s+)?(.+?)(?=[.!?](?:\s|$)|$)/gid],
    ['PERSON', /\b(?:[Mm]y name is|[Tt]his is|[Nn]ame's|[Ss]igned by)\s+([A-Z][\w'-]+(?:\s[A-Z][\w'-]+){0,2})/gd],
    ['ID_NUMBER', /\b[A-Z]{1,3}[\s-]?\d{6,}\b/gd],
    ['PROJECT', /\b(?:Project\s+)?(?:Bluebird|Nightfall|Kestrel)\b/gid],
  ];
  const WORD = { zero: 0, oh: 0, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9 };
  const ATOM = /\d+|\b(?:zero|oh|one|two|three|four|five|six|seven|eight|nine)\b/gi;
  const AMOUNT = /[$€£]\s?\d[\d,]*(?:\.\d+)?|\b\d[\d,]*(?:\.\d+)?\s?(?:dollars|euros|percent|%|people|customers|users|orders|hours|days|weeks|months|years|minutes|thousand|million|billion)/gi;
  const CONTEXT = [['CREDIT_CARD', /\b(?:card|visa|mastercard|amex)\b[^.!?]{0,30}$/i], ['SSN', /\b(?:social(?: security)?|ssn)\b[^.!?]{0,30}$/i],
    ['BANK_ACCOUNT', /\b(?:account|routing|iban)\b[^.!?]{0,30}$/i], ['PASSWORD', /\b(?:pin|cvv|cvc|security code)\b[^.!?]{0,20}$/i]];

  function numbers(text) {
    const skip = [...text.matchAll(AMOUNT)].map((m) => [m.index, m.index + m[0].length]);
    const runs = [];
    for (const m of text.matchAll(ATOM)) {
      if (skip.some(([a, b]) => m.index >= a && m.index < b)) continue;
      const digits = /\d/.test(m[0]) ? m[0] : String(WORD[m[0].toLowerCase()]);
      const last = runs[runs.length - 1];
      if (last && /^[\s\-–.,()/+]{0,4}$/.test(text.slice(last.end, m.index))) {
        last.end = m.index + m[0].length; last.digits += digits; last.groups.push(digits);
      } else runs.push({ start: m.index, end: m.index + m[0].length, digits, groups: [digits] });
    }
    const out = [];
    for (const r of runs) {
      const n = r.digits.length;
      const before = text.slice(Math.max(0, r.start - 70), r.start);
      const ctx = CONTEXT.find(([, re]) => re.test(before))?.[0];
      const years = r.groups.every((g) => /^(?:19|20)\d\d$/.test(g));
      const label = n >= 13 && n <= 19 ? 'CREDIT_CARD' : ctx && n >= 3 ? ctx : years || n < 7 ? null
        : r.groups.map((g) => g.length).join() === '3,2,4' ? 'SSN' : n === 7 || n === 10 || n === 11 ? 'PHONE_NUMBER' : 'ACCOUNT_NUMBER';
      if (label) out.push([r.start, r.end, label]);
    }
    return out;
  }

  return (text) => {
    const spans = numbers(text);
    for (const [label, re] of RULES) {
      for (const m of text.matchAll(re)) {
        const [a, b] = m.indices[1] ?? m.indices[0];
        spans.push([a, b, label]);
      }
    }
    spans.sort((x, y) => x[0] - y[0] || y[1] - x[1]);
    const parts = [];
    let pos = 0;
    let blocked = 0;
    for (const [a, b, label] of spans) {
      if (b <= pos) continue;
      if (a < pos) { pos = b; continue; } // overlaps the previous block: extend it
      if (a > pos) parts.push({ text: text.slice(pos, a) });
      parts.push({ redacted: label });
      blocked++;
      pos = b;
    }
    if (pos < text.length) parts.push({ text: text.slice(pos) });
    return { parts, blocked };
  };
})();

  const asText = (parts) => parts.map((p) => p.text ?? `[${p.redacted}]`).join('');
  const asParts = (s) => s.split(/(\[[A-Z_]+\])/).filter(Boolean).map((x) => (/^\[[A-Z_]+\]$/.test(x) ? { redacted: x.slice(1, -1) } : { text: x }));

  /** SafeScribe's rule-based autopsy (used when no AI is reachable), on guarded text only. */
  function autopsy(lines) {
    const DECISION = /\b(?:we (?:have )?(?:decided|agreed|approved)|decision is|it's decided|we are going with|we're going with|let's go with)\b/i;
    const ACTION = /(?:^|[,;]\s*|\band\s+)(\[PERSON\]|I|we|[A-Z][a-z]+)(?:'ll| will| needs? to| is going to| should| has to)\s+(?!(?:not|never|probably|maybe|be|have|see)\b)([^.;?!]{4,})/;
    const DUE = /\b(?:by|before|on|until)\s+((?:next |this |end of |the end of )*(?:monday|tuesday|wednesday|thursday|friday|saturday|sunday|tomorrow|today|noon|day|week|month|quarter))|\b(tomorrow|next week|next month)\b/i;
    const NOT = new Set(['It', 'That', 'This', 'There', 'What', 'Who', 'He', 'She', 'They', 'You', 'Revenue', 'Sales']);
    const sentences = lines.flatMap((l) => l.split(/([.!?])\s+/).reduce((a, x, i) => { if (i % 2) a[a.length - 1] += x; else a.push(x); return a; }, []))
      .map((s) => s.trim()).filter((s) => s.split(/\s+/).length > 2);
    if (!sentences.length) return { summary: [{ text: 'Too little was said, so there is nothing to dissect.' }], decisions: [], action_items: [], email_score: 100, verdict: [{ text: 'Could have been a blank email.' }], source: 'Basic mode (no AI)' };
    const decisions = sentences.filter((s) => DECISION.test(s));
    const actions = [];
    for (const s of sentences) {
      const m = !decisions.includes(s) && !s.endsWith('?') && ACTION.exec(s);
      if (!m || NOT.has(m[1])) continue;
      const due = DUE.exec(s);
      const task = (due ? m[2].replace(due[0], '') : m[2]).replace(/^[ ,]+|[ ,]+$/g, '');
      actions.push({ task: asParts(task[0].toUpperCase() + task.slice(1)), owner: /^(?:I|we|We)$/.test(m[1]) ? null : asParts(m[1]), due: due ? [{ text: due[1] || due[2] }] : null });
    }
    const score = Math.max(5, Math.min(95, 95 - Math.min(decisions.length, 4) * 14 - Math.min(actions.length, 5) * 9 - sentences.filter((s) => s.endsWith('?')).length * 4));
    const verdict = [[80, 'This meeting was an email wearing a trench coat.'], [60, 'A solid email with a side of small talk.'], [40, 'Half meeting, half email. A memeeting.'], [20, 'Mostly earned its calendar slot.'], [0, 'Real decisions happened. Your inbox is jealous.']].find(([n]) => score >= n)[1];
    return {
      summary: asParts(`${sentences.slice(0, 2).join(' ')} In all: ${decisions.length} decisions and ${actions.length} action items.`),
      decisions: decisions.map(asParts), action_items: actions, email_score: score, verdict: [{ text: verdict }], source: 'Basic mode (no AI)',
    };
  }

  let live = null;
  window.WebSocket = class {
    static OPEN = 1;
    constructor() {
      this.readyState = 0;
      this.timers = [];
      this.own = [];
      this.blocked = 0;
      this.next = 1;
      this.s = {
        mode: 'ptt', listening: false, stt: 'ready', error: null, guard: DATA.guard, ai: DATA.ai, ai_ready: false, phase: 'idle', elapsed: 0,
        running: false, clears_in: null, demo: false, asking: false, voice: false, attendees: 6, hourly_rate: 85,
      };
      this.later(() => { this.readyState = 1; live = this; this.onopen?.(); this.push(); }, 50);
    }
    later(f, ms) { this.timers.push(setTimeout(f, ms)); }
    stop() { this.timers.forEach(clearTimeout); this.timers = []; }
    close() { this.stop(); this.readyState = 3; }
    emit(e) { this.onmessage?.({ data: JSON.stringify(e) }); }
    push(p) {
      Object.assign(this.s, p);
      if (this.s.running) this.s.elapsed = (performance.now() - this.t0) / 1000;
      this.emit({ type: 'state', ...this.s });
    }
    clear() {
      this.stop();
      this.own = [];
      this.blocked = 0;
      this.emit({ type: 'cleared' });
      this.emit({ type: 'blocked', count: 0 });
      this.emit({ type: 'autopsy', result: null });
      this.emit({ type: 'qa', result: null });
      this.push({ phase: 'idle', elapsed: 0, running: false, clears_in: null, demo: false, asking: false });
    }
    begin(demo) {
      this.clear();
      this.t0 = performance.now();
      this.push({ phase: 'live', running: true, demo });
    }
    play() {
      this.begin(true);
      for (const [t, e] of DATA.events) this.later(() => this.emit(e), t * 1000);
      this.later(() => this.end(), LAST + 1200);
    }
    /** A visitor's own line. Only the guarded version is kept. */
    say(raw) {
      if (this.s.demo || this.s.phase === 'ending') return false;
      if (this.s.phase !== 'live') this.begin(false);
      const { parts, blocked } = guard(raw);
      this.own.push(asText(parts));
      this.blocked += blocked;
      this.emit({ type: 'segment', id: 5000 + this.next++, final: true, parts });
      this.emit({ type: 'blocked', count: this.blocked });
      return true;
    }
    end() {
      if (this.s.phase !== 'live') return;
      const own = !this.s.demo;
      this.stop();
      this.push({ demo: false, phase: 'ending', asking: false });
      // The recorded autopsy describes the whole replay, so ending it early skips to the end first.
      if (!own) for (const [, e] of DATA.events) if (e.type === 'blocked' || e.final) this.emit(e);
      this.later(() => {
        this.push({ running: false, phase: 'ended', clears_in: 90 });
        this.emit({ type: 'autopsy', result: own ? autopsy(this.own) : DATA.autopsy });
        this.later(() => this.clear(), 90000);
      }, 1200);
    }
    ask(q) {
      this.push({ asking: true });
      const other = { question: [], pending: false, answer: [{ text: 'This demo answers only its three examples. Press Clear to see them again.' }], source: 'Demo' };
      this.later(() => {
        this.emit({ type: 'qa', result: DATA.asks[q] ?? other });
        this.push({ asking: false });
      }, 700);
    }
    send(raw) {
      const m = JSON.parse(raw);
      if (m.type === 'demo') m.on ? this.play() : this.clear();
      else if (m.type === 'end') this.end();
      else if (m.type === 'clear') this.clear();
      else if (m.type === 'ask') this.ask(m.text);
      else if (m.type === 'set_mode') this.push({ mode: m.mode });
      else if (m.type === 'settings') this.push({ attendees: m.attendees, hourly_rate: m.hourly_rate });
    }
  };
  addEventListener('DOMContentLoaded', () => {
    const d = document.createElement('div');
    d.className = 'demo-bar';
    d.innerHTML = `<p><a href="../">← Back</a> <span>Demo. Press <b>Run demo</b> for a replay redacted by the real guard, or try your own line with a <b>simplified</b> guard that misses most names. Please use made-up details. Nothing leaves this page.</span></p>
      <form><input class="masked" maxlength="300" autocomplete="off" spellcheck="false" aria-label="Your own line, hidden until checked" placeholder="Type a line, e.g. My card number is 4111 1111 1111 1111" /><button>Say it</button><button type="button" class="sample">Use an example</button><output></output></form>`;
    const form = d.querySelector('form');
    const input = d.querySelector('input');
    const out = d.querySelector('output');
    const say = (text) => {
      const t = text.trim();
      input.value = '';
      out.textContent = !t ? '' : live?.say(t) ? '' : 'Stop the replay first.';
    };
    form.onsubmit = (e) => { e.preventDefault(); say(input.value); };
    const samples = ['My name is Jordan Avery and my email is jordan at example dot com.', 'The door code is 4471, and call me on 414-555-0132.', 'We agreed to ship Project Nightfall in May.', 'Priya will send the budget by Friday.', 'The staging API key is sk-demo-4f9a8b7c6d5e.'];
    let i = 0;
    d.querySelector('.sample').onclick = () => say(samples[i++ % samples.length]);
    document.body.prepend(d);
  });
})();
</script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
