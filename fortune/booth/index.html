<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07383d" />

    <title>Tech Fortune</title>
    <script type="module" crossorigin src="./assets/index-D6SYMklK.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index--4i91FD-.css">
    <meta name="description" content="Tech Fortune in your browser: three taps, one fortune, one receipt." />
    <style>.demo-home{position:fixed;left:50%;bottom:.4rem;transform:translateX(-50%);z-index:5;padding:.45rem .9rem;border-radius:1rem;background:#042529;color:#fff4dc;font-weight:600;font-size:.95rem}
</style>
    <script>(() => {
  'use strict'
  // Stands in for the booth server: same questions, pre-written fortunes, receipt drawn in the browser.
  const CONFIG = {"booth": "Tech Fortune", "save_on_tablet": true, "safescribe_url": "", "questions": [{"id": "superpower", "text": "Pick a superpower", "options": [{"id": "time", "emoji": "⏳", "label": "Pause time"}, {"id": "bugs", "emoji": "🔍", "label": "See every bug"}, {"id": "teleport", "emoji": "🌀", "label": "Teleport"}, {"id": "machines", "emoji": "🤖", "label": "Talk to machines"}]}, {"id": "fuel", "text": "Coffee, tea, or energy drink?", "options": [{"id": "coffee", "emoji": "☕", "label": "Coffee"}, {"id": "tea", "emoji": "🍵", "label": "Tea"}, {"id": "energy", "emoji": "⚡", "label": "Energy drink"}, {"id": "water", "emoji": "💧", "label": "Just water"}]}, {"id": "era", "text": "Favorite tech era?", "options": [{"id": "arcade", "emoji": "🕹️", "label": "80s arcades"}, {"id": "dialup", "emoji": "📞", "label": "90s dial-up"}, {"id": "phones", "emoji": "📱", "label": "Flip phones"}, {"id": "ai", "emoji": "✨", "label": "The AI age"}]}]}
  const FONT = '"IBM Plex Mono", ui-monospace, Consolas, monospace'
  const PORTFOLIO = 'a-husseini.github.io/portfolio'
  const W = 640
  const SCALE = 2
  let canvas
  let bag = []
  let count = 0
  function wrap(ctx, text, width) {
    const lines = []
    let line = ''
    for (const word of text.split(' ')) {
      const next = line ? `${line} ${word}` : word
      if (line && ctx.measureText(next).width > width) {
        lines.push(line)
        line = word
      } else line = next
    }
    return line ? [...lines, line] : lines
  }

  function draw(f, qr) {
    const tall = document.createElement('canvas')
    tall.width = W * SCALE
    tall.height = 2400 * SCALE
    const ctx = tall.getContext('2d')
    ctx.scale(SCALE, SCALE)
    ctx.fillStyle = '#fff'
    ctx.fillRect(0, 0, W, 2400)
    ctx.fillStyle = ctx.strokeStyle = '#000'
    ctx.textAlign = 'center'
    ctx.textBaseline = 'top'
    let y = 40

    const text = (s, size, weight, after = 0, lead = 1.3) => {
      ctx.font = `${weight} ${size}px ${FONT}`
      for (const line of wrap(ctx, s, W - 80)) {
        ctx.fillText(line, W / 2, y)
        y += size * lead
      }
      y += after
    }
    const divider = () => {
      for (let x = 32; x < W - 32; x += 14) ctx.fillRect(x, y, 8, 3)
      y += 24
    }

    ctx.save()
    ctx.translate(W / 2 - 64, y)
    ctx.scale(2, 2)
    ctx.lineWidth = 3.2
    ctx.lineCap = 'square'
    ctx.stroke(new Path2D('M4 58 L20 6 L36 58 M44 6 V58 M60 6 V58 M11 36 H60'))
    ctx.restore()
    y += 148

    text('TECH FORTUNE', 44, 600, 16)
    if (f.name) text(`A fortune for ${f.name}`, 32, 600, 14)
    divider()
    text(f.text, 32, 400, 18, 1.35)
    divider()
    text(`Lucky number: ${f.number}`, 32, 600, 4)
    text(`Lucky language: ${f.language}`, 32, 600, 18)
    divider()
    text('Built by Amir Husseini', 29, 600)
    text('Full-stack developer', 27, 400, 8)
    if (qr) {
      ctx.imageSmoothingEnabled = false
      ctx.drawImage(qr, W / 2 - 125, y, 250, 250)
      y += 256
    }
    text(PORTFOLIO, 25, 400, 18)
    text(f.booth ? `${f.date} | ${f.booth}` : f.date, 25, 400)

    const out = document.createElement('canvas')
    out.width = W * SCALE
    out.height = Math.round((y + 36) * SCALE)
    out.getContext('2d').drawImage(tall, 0, 0)
    return out
  }

  const toBlob = (type) => new Promise((done) => canvas.toBlob(done, type, 0.95))

  // One JPEG on one 80 mm wide page: small enough to write by hand, so no PDF library.
  async function toPdf() {
    const jpeg = new Uint8Array(await (await toBlob('image/jpeg')).arrayBuffer())
    const w = 226.77
    const h = ((w * canvas.height) / canvas.width).toFixed(2)
    const content = `q ${w} 0 0 ${h} 0 0 cm /I Do Q`
    const objects = [
      ['<</Type/Catalog/Pages 2 0 R>>'],
      ['<</Type/Pages/Kids[3 0 R]/Count 1>>'],
      [`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${w} ${h}]/Resources<</XObject<</I 4 0 R>>>>/Contents 5 0 R>>`],
      [
        `<</Type/XObject/Subtype/Image/Width ${canvas.width}/Height ${canvas.height}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jpeg.length}>>\nstream\n`,
        jpeg,
        '\nendstream',
      ],
      [`<</Length ${content.length}>>\nstream\n${content}\nendstream`],
    ]
    const parts = []
    let size = 0
    const add = (p) => {
      parts.push(p)
      size += p.length // every string here is ASCII
    }
    add('%PDF-1.4\n')
    const offsets = objects.map((body, i) => {
      const at = size
      add(`${i + 1} 0 obj\n`)
      body.forEach(add)
      add('\nendobj\n')
      return at
    })
    const xref = size
    add(`xref\n0 ${objects.length + 1}\n0000000000 65535 f \n`)
    offsets.forEach((o) => add(`${String(o).padStart(10, '0')} 00000 n \n`))
    add(`trailer\n<</Size ${objects.length + 1}/Root 1 0 R>>\nstartxref\n${xref}\n%%EOF`)
    return new Blob(parts, { type: 'application/pdf' })
  }

  function loadQr() {
    return new Promise((done) => {
      const img = new Image()
      img.onload = () => done(img)
      img.onerror = () => done(null)
      img.src = '../portfolio-qr.png'
    })
  }


  for (const w of [400, 600]) {
    document.fonts.add(new FontFace('IBM Plex Mono', `url(../ibm-plex-mono-latin-${w}-normal.woff2)`, { weight: String(w) }))
  }
  const realFetch = window.fetch.bind(window)
  const json = (v, status = 200) => new Response(JSON.stringify(v), { status, headers: { 'Content-Type': 'application/json' } })
  const b64 = (blob) =>
    new Promise((done) => {
      const r = new FileReader()
      r.onload = () => done(r.result.split(',')[1])
      r.readAsDataURL(blob)
    })
  async function tell(body) {
    if (!bag.length) {
      bag = await (await realFetch('../fortunes.json')).json()
      for (let i = bag.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1))
        ;[bag[i], bag[j]] = [bag[j], bag[i]]
      }
    }
    const f = bag.pop()
    const [qr] = await Promise.all([loadQr(), ...[400, 600].map((w) => document.fonts.load(`${w} 32px "IBM Plex Mono"`).catch(() => {}))])
    canvas = draw({
      text: f.fortune, number: f.lucky_number, language: f.lucky_language, booth: '',
      name: String(body.name || '').replace(/\s+/g, ' ').trim().slice(0, 20),
      date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
    }, qr)
    return { ...f, png: await b64(await toBlob('image/png')), pdf: await b64(await toPdf()), count: ++count, share_url: null }
  }
  window.fetch = async (url, init) => {
    const path = String(url)
    if (path === '/api/config') return json(CONFIG)
    if (path === '/api/fortune') return json(await tell(JSON.parse(init.body)))
    if (path.startsWith('/api/')) return json({}, 404)
    return realFetch(url, init)
  }
  addEventListener('DOMContentLoaded', () => {
    const a = document.createElement('a')
    a.href = '../../projects/'
    a.className = 'demo-home'
    a.textContent = '← Portfolio'
    document.body.append(a)
  })
})()
</script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
